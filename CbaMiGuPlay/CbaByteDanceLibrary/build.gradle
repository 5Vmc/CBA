plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.boyou.cba.cbabytedancelibrary'
    compileSdk 34

    defaultConfig {
        minSdk 22

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
repositories {
    mavenCentral()
    // 或者
    google()
    // 还有其他可能的仓库
    maven {
        url 'https://artifact.bytedance.com/repository/Volcengine/'
    }
    // 其他仓库
}
dependencies {
    implementation files('libs/classes.jar')

    // 在build.gradle文件的dependencies中引入SDK，集成Lite版本
    // Applog 上报组件（必须）
    implementation 'com.bytedance.applog:RangersAppLog-Lite-cn:6.16.9'
    // 商业化转化组件（必须）
    implementation 'com.bytedance.ads:AppConvert:1.3.2.0'


}